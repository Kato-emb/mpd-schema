name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            fixtures/dashschema
            fixtures/dashif
            fixtures/w3c
          key: fixtures-${{ hashFiles('xtask/src/main.rs', 'xtask/Cargo.toml') }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask fetch-fixtures
      # serialized_dashschema_samples_validate_against_xsd（#[ignore]）が
      # xmllint を必要とする
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: cargo test -- --include-ignored

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # xtask is a host-only dev tool (network/tar deps); it never targets wasm.
      - run: cargo build --target wasm32-unknown-unknown --workspace --exclude xtask
